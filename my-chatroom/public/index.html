<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sanjana's Chatroom</title>

    <link rel="stylesheet" href="/style.css" />
    <script src="/socket.io/socket.io.js"></script>
    <link rel="manifest" href="/manifest.json" />
</head>
<body>
    <h1>Sanjana's Chatroom</h1>

    <div id="chatWrapper">
        <div id="nameWrapper">
            <input id="nameInput" type="text" placeholder="Your Name"><p style="display: inline;"> 👈 your name!</p>
            <p id="keywordList">Key words: "chat am i muted', 'im so scared rn', 'son', 'ok mijo', 'cookie', 'twin'</p>
        </div>
        <div id="threadWrapper">
            <ul id="chatThreadList">
                <!-- messages will go here -->
            </ul>
        </div>
        <form id="messageForm">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" />
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
